__include__: ['rtdetr_r50vd_6x_coco.yml']

num_classes: 3
remap_mscoco_category: False
output_dir: ./output/rtdetr_r50vd_6x_hazydet

# Use a full COCO detector checkpoint with train.py -t for transfer learning.
# Disable the separate ImageNet download (also useful for offline evaluation).
PResNet:
  pretrained: False

train_dataloader:
  batch_size: 4
  num_workers: 0
  dataset:
    img_folder: ./dataset/HazyDet/train/hazy_images
    ann_file: ./dataset/hazydet_rtdetr/train.json

val_dataloader:
  batch_size: 4
  num_workers: 0
  dataset:
    img_folder: ./dataset/HazyDet/val/hazy_images
    ann_file: ./dataset/hazydet_rtdetr/val.json
